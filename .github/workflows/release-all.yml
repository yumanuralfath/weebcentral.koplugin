name: Build and release all KOReader toolchains

# Manual only: builds the Rust core with every KOReader koxtoolchain (2026.08)
# and publishes one GitHub Release with one plugin ZIP per toolchain.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create (for example v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark this GitHub Release as a pre-release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  KOXTOOLCHAIN_VERSION: "2026.08"

jobs:
  test:
    name: Validate tag and run native tests
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Version must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Use a new tag."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run native tests
        working-directory: weebcentral_core
        run: cargo test --locked

  build:
    name: Build ${{ matrix.toolchain }}
    needs: test
    runs-on: ubuntu-latest
    # Experimental toolchains may fail (very old glibc / soft-float ABI)
    # without blocking the release of the other ones.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Stable: hard-float ARMv7 (gnueabihf) ---
          - toolchain: kindlehf
            cross_prefix: arm-kindlehf-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 8cc7dfbd71abd78f9e947d6b2e20670288a4402edc7b07176bca791f7eaf87d0
            experimental: false
          - toolchain: kobo
            cross_prefix: arm-kobo-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 326dd2a2a5ca371073c4ebc783d578f93f4122d83c46b84ec85b9e3ed5ff2305
            experimental: false
          - toolchain: kobov4
            cross_prefix: arm-kobov4-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 42baff346352f1e31de427245adcab39d85be4ba935b72da1605d09e4a15a8ef
            experimental: false
          - toolchain: kobov5
            cross_prefix: arm-kobov5-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: a9eba0aaf17e5cc94fdabb46c2ae06d9bb41936b869ea6479d325c9f79b14a64
            experimental: false
          - toolchain: nickel
            cross_prefix: arm-nickel-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 7583564ef5d75d15558206c7b04db02a8113a772cf7fd090f4ad4bb4890efea2
            experimental: false
          - toolchain: pocketbookhf
            cross_prefix: arm-pocketbookhf-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 0e961fade5c8d44e6152443c839528cc4702e0bc1ae74dbde92946d552767830
            experimental: false
          - toolchain: remarkable
            cross_prefix: arm-remarkable-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 4f8f68d1c1836af4c1166baa5826ad674ffe48a527c1d6e8613f8ecdc784d477
            experimental: false
          # --- Stable: AArch64 ---
          - toolchain: remarkable-aarch64
            cross_prefix: aarch64-remarkable-linux-gnu
            rust_target: aarch64-unknown-linux-gnu
            sha256: 4b00e0351a702d37be5ae660d9077d9ae3da22e5145e28d8089f193f325f446a
            experimental: false
          # --- Experimental: soft-float / legacy glibc ---
          - toolchain: kindlepw2
            cross_prefix: arm-kindlepw2-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: 84bc8b4143796ba0c9e6306aefc596ca2e2685cf9174a285bb14f36425de8104
            experimental: true
          - toolchain: kindle5
            cross_prefix: arm-kindle5-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: 4f519d30c6b041ba3e8a34f2b62437232b8b27e672c1b892c8d350c0f7706c98
            experimental: true
          - toolchain: kindle
            cross_prefix: arm-kindle-linux-gnueabi
            rust_target: arm-unknown-linux-gnueabi
            sha256: 4aa5751f5e29268d91999d4754d14ce0d6db5510e46b26bd7b2a8ce25fe09ad8
            experimental: true
          - toolchain: cervantes
            cross_prefix: arm-cervantes-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: 2f78a14dd36f7e915634ff8ac6e29f1e7d2db5b59da292b3401c2a1165c8b700
            experimental: true
          - toolchain: pocketbook
            cross_prefix: arm-pocketbook-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: 3dbd22d7f3f485681ca9e4baef7ed463f540ffeca88fa38ffc51b6d336ec2112
            experimental: true
          - toolchain: bookeen
            cross_prefix: arm-bookeen-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: b087934eb1fc4e13d988bc7571755a08a227b67579e110416ba7931caad2cf36
            experimental: true
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
      CROSS_PREFIX: ${{ matrix.cross_prefix }}
      RUST_TARGET: ${{ matrix.rust_target }}
      TOOLCHAIN_SHA256: ${{ matrix.sha256 }}
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd zip

      - name: Install KOReader ${{ matrix.toolchain }} toolchain
        run: |
          archive="$RUNNER_TEMP/${TOOLCHAIN}.tar.zst"
          curl --fail --location --retry 3 \
            "https://github.com/koreader/koxtoolchain/releases/download/${KOXTOOLCHAIN_VERSION}/${TOOLCHAIN}.tar.zst" \
            --output "$archive"
          echo "${TOOLCHAIN_SHA256}  ${archive}" | sha256sum --check --status
          tar --zstd --extract --file "$archive" --directory "$HOME"
          echo "$HOME/x-tools/${CROSS_PREFIX}/bin" >> "$GITHUB_PATH"
          "$HOME/x-tools/${CROSS_PREFIX}/bin/${CROSS_PREFIX}-gcc" --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Configure cross-compilation environment
        run: |
          lower="${RUST_TARGET//-/_}"
          upper="$(echo "$lower" | tr '[:lower:]' '[:upper:]')"
          {
            echo "CARGO_TARGET_${upper}_LINKER=${CROSS_PREFIX}-gcc"
            echo "CC_${lower}=${CROSS_PREFIX}-gcc"
            echo "AR_${lower}=${CROSS_PREFIX}-ar"
          } >> "$GITHUB_ENV"

      - name: Cross-compile core for ${{ matrix.toolchain }}
        working-directory: weebcentral_core
        run: cargo build --locked --release --target "$RUST_TARGET"

      - name: Package plugin ZIP
        run: |
          binary="weebcentral_core/target/${RUST_TARGET}/release/weebcentral_core"
          test -x "$binary"
          file "$binary" | tee "$RUNNER_TEMP/binary-info.txt"
          grep -Eiq 'ARM|aarch64' "$RUNNER_TEMP/binary-info.txt"

          stage="$RUNNER_TEMP/package/WeebCentral.koplugin"
          mkdir -p "$stage/bin" dist
          cp WeebCentral.koplugin/_meta.lua WeebCentral.koplugin/main.lua "$stage/"
          cp -a WeebCentral.koplugin/lib "$stage/lib"
          install -m 755 "$binary" "$stage/bin/weebcentral_core_dev"

          archive="WeebCentralDownloader-${RELEASE_TAG}-${TOOLCHAIN}.zip"
          (cd "$RUNNER_TEMP/package" && zip -qr "$GITHUB_WORKSPACE/dist/$archive" WeebCentral.koplugin)
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.toolchain }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: dist

      - name: Write release notes and combined checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          {
            echo "Built with [KOReader koxtoolchain ${KOXTOOLCHAIN_VERSION}](https://github.com/koreader/koxtoolchain/releases/tag/${KOXTOOLCHAIN_VERSION})."
            echo
            echo "Install the ZIP that matches your device's KOReader toolchain, then copy the \`WeebCentral.koplugin\` folder into KOReader's \`plugins\` directory. See the README for the device-to-toolchain table."
            echo
            echo "Toolchains in this release:"
            for f in WeebCentralDownloader-*.zip; do
              name="${f#WeebCentralDownloader-${RELEASE_TAG}-}"
              echo "- \`${name%.zip}\`"
            done
          } > ../release-notes.md
          ls -l

      - name: Create GitHub Release
        run: |
          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WeebCentral Downloader $RELEASE_TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            "${args[@]}" \
            dist/WeebCentralDownloader-*.zip \
            dist/SHA256SUMS
