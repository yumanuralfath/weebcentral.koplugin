[package]
name = "weebcentral_core"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
regex = "1"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
